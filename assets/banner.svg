<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#111628"/>
      <stop offset="100%" stop-color="#0d0f1d"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#654FF0"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>

    <radialGradient id="pulse-glow-1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#654FF0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#654FF0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pulse-glow-2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for subtle drop-shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="280" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Animated Glow Orbs in Background -->
  <circle cx="180" cy="90" r="140" fill="url(#pulse-glow-1)">
    <animate attributeName="r" values="120;160;120" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="720" cy="190" r="150" fill="url(#pulse-glow-2)">
    <animate attributeName="r" values="130;170;130" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle Tech Grid Lines in Background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="280"/>
    <line x1="150" y1="0" x2="150" y2="280"/>
    <line x1="250" y1="0" x2="250" y2="280"/>
    <line x1="350" y1="0" x2="350" y2="280"/>
    <line x1="450" y1="0" x2="450" y2="280"/>
    <line x1="550" y1="0" x2="550" y2="280"/>
    <line x1="650" y1="0" x2="650" y2="280"/>
    <line x1="750" y1="0" x2="750" y2="280"/>
    <line x1="850" y1="0" x2="850" y2="280"/>
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="140" x2="900" y2="140"/>
    <line x1="0" y1="210" x2="900" y2="210"/>
  </g>

  <!-- Animated Circuit Stream Flows (Dynamic Aspect) -->
  <g stroke-linecap="round" opacity="0.4">
    <!-- Stream 1 -->
    <path d="M 50 140 H 220 L 260 180 H 420" fill="none" stroke="#654FF0" stroke-width="2" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Stream 2 -->
    <path d="M 480 100 H 640 L 680 140 H 850" fill="none" stroke="#00D2FF" stroke-width="2" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Animated Floating Particles (stay in background) -->
  <circle cx="120" cy="180" r="3" fill="#654FF0" opacity="0.8">
    <animate attributeName="cy" values="180;160;180" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="90" r="3.5" fill="#00D2FF" opacity="0.8">
    <animate attributeName="cy" values="90;110;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="60" r="2.5" fill="#C084FC" opacity="0.7">
    <animate attributeName="cy" values="60;45;60" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580" cy="220" r="3" fill="#38BDF8" opacity="0.7">
    <animate attributeName="cy" values="220;235;220" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer Border with subtle gradient glow -->
  <rect x="2" y="2" width="896" height="276" rx="15" fill="none" stroke="url(#accent-grad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- FOREGROUND CONTENT: Guaranteed high visibility and contrast -->
  <g filter="url(#shadow)">
    <!-- Top Pill / Badge -->
    <rect x="330" y="32" width="240" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="450" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#A5B4FC" text-anchor="middle" letter-spacing="0.8">
      ⚡ HIGH-PERFORMANCE RUNTIMES
    </text>

    <!-- Main Title -->
    <text x="450" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#text-grad)" text-anchor="middle" letter-spacing="-0.5">
      Awesome WebAssembly Runtimes
    </text>

    <!-- Subtitle -->
    <text x="450" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="middle">
      Curated Guide to Execution Engines, Edge Computing &amp; Server-Side Wasm
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(160, 185)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0" text-anchor="middle">⚡ Wasmtime / Wasmer</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(145, 0)">
        <rect width="135" height="34" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="67" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0" text-anchor="middle">🌐 Edge &amp; Cloud Wasm</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(295, 0)">
        <rect width="135" height="34" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="67" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0" text-anchor="middle">🛡️ WASI &amp; Sandbox</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(445, 0)">
        <rect width="135" height="34" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="67" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0" text-anchor="middle">📦 Component Model</text>
      </g>
    </g>
  </g>
</svg>
